# 示例：在 profile 的 cordis.patch.yml 里加自己的 provider
#
# 用法：
#   1. 关闭 DSH WebUI；
#   2. 把下面内容追加到 <DSH_HOME>\profiles\web\cordis.patch.yml 末尾；
#   3. 把 <...> 占位符换成你自己的值；不用的 provider 整段删掉；
#   4. 把 key 设到环境变量 MY_PROVIDER_API_KEY / MY_ANTHROPIC_RELAY_API_KEY，
#      或在 DSH 设置里存进凭据库；
#   5. 重启 DSH WebUI。
#
# 这里只写环境变量的名字，绝不写 key 的值。
# 如果 cordis.patch.yml 里已有 id: llm-pi-ai 或 id: agent-default-model，
# 请把下面的内容合并进原有那一行，不要重复添加同 id 的行。
# 详细说明见 docs/providers.md。

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      # OpenAI 兼容中转
      my-openai-relay:
        apiKeyEnv: MY_PROVIDER_API_KEY
        api: openai-completions
        baseURL: <YOUR_BASE_URL>/v1
        models:
          - id: <MODEL_ID>
            name: <显示名>
            contextWindow: 128000
            maxTokens: 16384
            input:
              - text

      # Anthropic 兼容中转
      my-anthropic-relay:
        apiKeyEnv: MY_ANTHROPIC_RELAY_API_KEY
        api: anthropic-messages
        baseURL: <YOUR_BASE_URL>/
        models:
          - id: <MODEL_ID>
            name: <显示名>
            contextWindow: 200000
            maxTokens: 32000
            input:
              - text
              - image

# 新会话默认使用的模型
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: my-openai-relay
    model: <MODEL_ID>
