# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
- id: pwsh-sandbox
  name: "@deepseek-ai/dsh-pwsh-sandbox"
  config:
    timeoutMs: 1200000

- id: web-ui-pet
  name: "@linxin666/dsh-pet"
  disabled: true
  config:
    visible: false
    size: 160
    right: 562
    bottom: 0
    petId: whale-girl
- id: web-ui-skin-center
  disabled: true
- id: web-ui-ssh
  disabled: false
- id: web-ui-skill-explorer
  disabled: false
- id: web-ui-session-archive
  name: "@linxin666/dsh-session-archive"
  config:
    autoArchiveEnabled: true
- id: web-ui-browser-view
  name: "@linxin666/dsh-client-ui-browser-view"
  config:
    realBrowserEnabled: true
- id: web-ui-remote-bridge
  disabled: true
- id: web-ui-task-board-remote
  disabled: true
